<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raydius Sky Scout - Find Sun & Shade</title>
  
  <!-- PWA Meta Tags -->
  <meta name="description" content="Find sunshine near you, right now. Real-time cloud cover map to locate sunny spots or shaded areas within your radius.">
  <meta name="theme-color" content="#3B82F6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Raydius">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- React & Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Mapbox GL JS -->
  <script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>
  <link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' />
  
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
    }
    .mapboxgl-popup-content {
      padding: 12px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    
    // Lucide icon components
    const MapPin = () => <i data-lucide="map-pin"></i>;
    const Sun = ({ className }) => <i data-lucide="sun" className={className}></i>;
    const Loader2 = ({ className }) => <i data-lucide="loader-2" className={className}></i>;
    const Navigation = ({ className }) => <i data-lucide="navigation" className={className}></i>;

    function App() {
      const [userLocation, setUserLocation] = useState(null);
      const [weatherData, setWeatherData] = useState([]);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [selectedRadius, setSelectedRadius] = useState(5);
      const [searchQuery, setSearchQuery] = useState('');
      const [searchResults, setSearchResults] = useState([]);
      const [showSearchResults, setShowSearchResults] = useState(false);
      const [favorites, setFavorites] = useState([]);
      const [customSpots, setCustomSpots] = useState([]); // User-added local spots
      const [uvIndex, setUvIndex] = useState(null);
      const [showLocationSearch, setShowLocationSearch] = useState(false);
      const [locationSearchQuery, setLocationSearchQuery] = useState('');
      const [locationSearchResults, setLocationSearchResults] = useState([]);
      const [sunriseSunset, setSunriseSunset] = useState(null);
      const [auroraData, setAuroraData] = useState(null);

      const map = useRef(null);

      // Initialize Lucide icons
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Get location on mount
      useEffect(() => {
        getUserLocation();
      }, []);

      const getUserLocation = () => {
        setLoading(true);
        setError(null);
        
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (position) => {
              const location = {
                lat: position.coords.latitude,
                lon: position.coords.longitude
              };
              setUserLocation(location);
              fetchWeatherData(location, selectedRadius);
            },
            (error) => {
              // Fallback to Copenhagen
              const defaultLocation = { lat: 55.6761, lon: 12.5683 };
              setUserLocation(defaultLocation);
              fetchWeatherData(defaultLocation, selectedRadius);
            }
          );
        } else {
          const defaultLocation = { lat: 55.6761, lon: 12.5683 };
          setUserLocation(defaultLocation);
          fetchWeatherData(defaultLocation, selectedRadius);
        }
      };

      const searchLocation = async (query) => {
        if (!query || query.length < 3) {
          setSearchResults([]);
          setShowSearchResults(false);
          return;
        }

        try {
          const response = await fetch(
            `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=5`
          );
          const data = await response.json();
          setSearchResults(data);
          setShowSearchResults(true);
        } catch (error) {
          console.error('Location search error:', error);
        }
      };

      const selectLocation = (result) => {
        const location = {
          lat: parseFloat(result.lat),
          lon: parseFloat(result.lon)
        };
        setUserLocation(location);
        fetchWeatherData(location, selectedRadius);
        setSearchQuery(result.display_name);
        setShowSearchResults(false);
      };

      const generateGridPoints = (center, radiusKm, gridSize) => {
        const points = [];
        const latChange = radiusKm / 111;
        const lonChange = radiusKm / (111 * Math.cos(center.lat * Math.PI / 180));
        
        let id = 0;
        for (let i = -gridSize; i <= gridSize; i++) {
          for (let j = -gridSize; j <= gridSize; j++) {
            points.push({
              id: id++,
              lat: center.lat + (i * latChange / gridSize),
              lon: center.lon + (j * lonChange / gridSize)
            });
          }
        }
        return points;
      };

      const isNightTime = () => {
        if (!sunriseSunset) {
          console.log('No sunrise/sunset data yet');
          return false;
        }
        const now = new Date();
        const currentTime = now.getHours() * 60 + now.getMinutes();
        
        // Parse sunrise/sunset times (assuming format like "7:45 AM")
        const parseSunTime = (timeStr) => {
          if (!timeStr) return null;
          const match = timeStr.match(/(\d+):(\d+)\s*(AM|PM)/i);
          if (!match) return null;
          let hours = parseInt(match[1]);
          const minutes = parseInt(match[2]);
          const period = match[3].toUpperCase();
          if (period === 'PM' && hours !== 12) hours += 12;
          if (period === 'AM' && hours === 12) hours = 0;
          return hours * 60 + minutes;
        };
        
        const sunriseTime = parseSunTime(sunriseSunset.sunrise);
        const sunsetTime = parseSunTime(sunriseSunset.sunset);
        
        console.log('Nighttime check:', {
          currentTime,
          sunriseTime,
          sunsetTime,
          isNight: currentTime < sunriseTime || currentTime > sunsetTime
        });
        
        if (sunriseTime === null || sunsetTime === null) return false;
        
        return currentTime < sunriseTime || currentTime > sunsetTime;
      };

      const fetchWeatherData = async (location, radius) => {
        // Check cache first
        const cacheKey = `weather_${location.lat.toFixed(2)}_${location.lon.toFixed(2)}_${radius}`;
        const cached = localStorage.getItem(cacheKey);
        
        if (cached) {
          const { data, timestamp } = JSON.parse(cached);
          const age = Date.now() - timestamp;
          
          // Use cache if less than 15 minutes old
          if (age < 15 * 60 * 1000) {
            console.log('Using cached weather data');
            setWeatherData(data.weatherData);
            setUvIndex(data.uvIndex);
            setSunriseSunset(data.sunriseSunset);
            setAuroraData(data.auroraData);
            setLoading(false);
            return;
          }
        }
        
        setLoading(true);
        setError(null);
        
        const API_KEY = '41c4a42a581237839aa46daf451f8043';
        
        // Dynamic grid size based on radius
        let gridSize;
        if (radius <= 1) {
          gridSize = 5;  // 11x11 = 121 points for 1km
        } else if (radius <= 5) {
          gridSize = 5;  // 11x11 = 121 points for 5km
        } else if (radius <= 10) {
          gridSize = 7;  // 15x15 = 225 points for 10km
        } else if (radius <= 25) {
          gridSize = 9;  // 19x19 = 361 points for 25km
        } else {
          gridSize = 10; // 21x21 = 441 points for 50km
        }
        
        console.log(`Using ${(gridSize * 2 + 1) * (gridSize * 2 + 1)} weather points for ${radius}km radius`);
        
        const points = generateGridPoints(location, radius, gridSize);
        
        try {
          // Fetch real weather data
          const weatherPromises = points.map(async (point) => {
            try {
              const response = await fetch(
                `https://api.openweathermap.org/data/2.5/weather?lat=${point.lat}&lon=${point.lon}&appid=${API_KEY}&units=metric`
              );
              const data = await response.json();
              return {
                lat: point.lat,
                lon: point.lon,
                clouds: data.clouds?.all || 0,
                temp: data.main?.temp || 0,
                feelsLike: data.main?.feels_like || 0,
                name: data.name || `Spot ${point.id}`
              };
            } catch (error) {
              return null;
            }
          });

          const results = await Promise.all(weatherPromises);
          const validResults = results.filter(r => r !== null);
          setWeatherData(validResults);
          
          // Fetch UV Index
          let uvValue = 3;
          try {
            const uvResponse = await fetch(
              `https://api.openweathermap.org/data/2.5/uvi?lat=${location.lat}&lon=${location.lon}&appid=${API_KEY}`
            );
            const uvData = await uvResponse.json();
            uvValue = uvData.value || 0;
            
            // UV Alert
            if (uvValue >= 6 && 'Notification' in window && Notification.permission === 'granted') {
              new Notification('☀️ Raydius UV Alert', {
                body: `UV Index is ${uvValue.toFixed(1)} (High). Sunscreen recommended!`,
                icon: '☀️'
              });
            }
          } catch (error) {
            console.error('UV fetch error:', error);
          }
          setUvIndex(uvValue);
          
          // Fetch Sunrise/Sunset
          let sunriseSunsetData = { sunrise: '7:45 AM', sunset: '4:30 PM', dayLength: '8h 45m' };
          try {
            const sunResponse = await fetch(
              `https://api.sunrise-sunset.org/json?lat=${location.lat}&lng=${location.lon}&formatted=0`
            );
            const sunData = await sunResponse.json();
            if (sunData.status === 'OK') {
              const sunrise = new Date(sunData.results.sunrise);
              const sunset = new Date(sunData.results.sunset);
              sunriseSunsetData = {
                sunrise: sunrise.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }),
                sunset: sunset.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }),
                dayLength: sunData.results.day_length
              };
            }
          } catch (error) {
            console.error('Sunrise error:', error);
          }
          setSunriseSunset(sunriseSunsetData);

          // Fetch Aurora Data (NOAA)
          let auroraDataResult = { kpIndex: 2, probability: 'Low', visible: false, forecast: 'Data unavailable' };
          try {
            const auroraResponse = await fetch(
              'https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json'
            );
            const auroraJson = await auroraResponse.json();
            const latestReading = auroraJson[auroraJson.length - 1];
            const kpIndex = parseFloat(latestReading[1]);
            auroraDataResult = {
              kpIndex: kpIndex,
              probability: kpIndex < 3 ? 'Low' : kpIndex < 5 ? 'Moderate' : kpIndex < 7 ? 'High' : 'Very High',
              visible: location.lat > 50 && kpIndex >= 5,
              nextPeak: 'Next 3 hours',
              forecast: `Kp ${kpIndex} from NOAA`
            };
          } catch (error) {
            console.error('Aurora fetch error:', error);
          }
          setAuroraData(auroraDataResult);
          
          // Save to cache using local variables (not stale state)
          const cacheKey = `weather_${location.lat.toFixed(2)}_${location.lon.toFixed(2)}_${radius}`;
          const cacheData = {
            data: {
              weatherData: validResults,
              uvIndex: uvValue,
              sunriseSunset: sunriseSunsetData,
              auroraData: auroraDataResult
            },
            timestamp: Date.now()
          };
          localStorage.setItem(cacheKey, JSON.stringify(cacheData));
          console.log('Weather data cached for 15 minutes');
          
          setLoading(false);
        } catch (err) {
          console.error('Weather fetch error:', err);
          setError("Could not fetch weather data");
          setLoading(false);
        }
      };

      // Initialize Mapbox map when data is loaded
      useEffect(() => {
        if (!userLocation || weatherData.length === 0) {
          return;
        }
        
        if (!window.mapboxgl) {
          console.error('Mapbox GL not loaded');
          return;
        }
        
        let attempts = 0;
        const maxAttempts = 10;
        
        const tryInitMap = () => {
          attempts++;
          const container = document.getElementById('map-container');
          
          if (!container) {
            if (attempts < maxAttempts) {
              setTimeout(tryInitMap, 200);
              return;
            } else {
              console.error('Could not find map container after 10 attempts');
              return;
            }
          }
          
          console.log('Map container found!');
          
          if (map.current) {
            map.current.remove();
            map.current = null;
          }
          
          try {
            mapboxgl.accessToken = 'pk.eyJ1IjoiamFtZXNhbGV4YW5kZXJicm93biIsImEiOiJjbWxueGJtOWswd2xnM2xxdzhvcW95dG1lIn0.7vNm4lOmWM0kJPqPHEh6fg';
            
            const zoomLevel = selectedRadius <= 1 ? 15 : selectedRadius <= 5 ? 13 : selectedRadius <= 10 ? 12 : 11;
            
            map.current = new mapboxgl.Map({
              container: 'map-container',
              style: 'mapbox://styles/mapbox/streets-v12',
              center: [userLocation.lon, userLocation.lat],
              zoom: zoomLevel
            });

            map.current.addControl(new mapboxgl.NavigationControl());

            map.current.on('load', () => {
              console.log('Map loading with sunrise/sunset data:', sunriseSunset);
              
              // Add user location marker
              new mapboxgl.Marker({ color: '#3B82F6', scale: 1.3 })
                .setLngLat([userLocation.lon, userLocation.lat])
                .setPopup(new mapboxgl.Popup().setHTML('<strong>📍 You are here</strong>'))
                .addTo(map.current);

              // Add weather markers
              const nightTime = isNightTime();
              console.log('Is nighttime?', nightTime);
              const allMarkers = []; // Track all markers to close popups
              
              weatherData.forEach((point) => {
                const cloudPercent = Math.round(point.clouds);
                
                // Use night icon if it's nighttime
                const emoji = nightTime ? '🌙' : 
                  cloudPercent < 20 ? '☀️' : 
                  cloudPercent < 40 ? '🌤️' : 
                  cloudPercent < 60 ? '⛅' : 
                  cloudPercent < 80 ? '🌥️' : '☁️';
                
                const color = nightTime ? '#1e293b' :
                  point.clouds < 20 ? '#FBBF24' : 
                  point.clouds < 40 ? '#FDE047' : 
                  point.clouds < 60 ? '#D1D5DB' : 
                  point.clouds < 80 ? '#9CA3AF' : '#6B7280';
                
                const el = document.createElement('div');
                el.style.width = '28px';
                el.style.height = '28px';
                el.style.borderRadius = '50%';
                el.style.backgroundColor = color;
                el.style.border = '2px solid white';
                el.style.cursor = 'pointer';
                el.style.display = 'flex';
                el.style.alignItems = 'center';
                el.style.justifyContent = 'center';
                el.style.fontSize = '14px';
                el.style.boxShadow = '0 2px 6px rgba(0,0,0,0.3)';
                el.innerHTML = emoji;
                
                el.addEventListener('click', (e) => {
                  e.stopPropagation();
                  const url = `https://www.google.com/maps/dir/?api=1&destination=${point.lat},${point.lon}`;
                  window.open(url, '_blank');
                });

                const popup = new mapboxgl.Popup({ 
                  offset: 25, 
                  closeButton: true,
                  closeOnClick: false
                })
                  .setHTML(`
                    <div style="text-align: center; padding: 8px;">
                      <div style="font-size: 32px; margin-bottom: 6px;">${emoji}</div>
                      ${nightTime ? '<div style="color: #666; font-size: 12px; margin-bottom: 4px;">After sunset</div>' : ''}
                      <div style="font-size: 16px; font-weight: bold; margin-bottom: 4px;">${cloudPercent}% clouds</div>
                      <div style="color: #666; margin-bottom: 8px;">${Math.round(point.temp)}°C (feels ${Math.round(point.feelsLike)}°C)</div>
                      <button 
                        onclick="window.open('https://www.google.com/maps/dir/?api=1&destination=${point.lat},${point.lon}', '_blank')"
                        style="width: 100%; padding: 8px 16px; background: #3B82F6; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;"
                        onmouseover="this.style.background='#2563EB'"
                        onmouseout="this.style.background='#3B82F6'">
                        📍 Get Directions
                      </button>
                    </div>
                  `);

                const marker = new mapboxgl.Marker(el)
                  .setLngLat([point.lon, point.lat])
                  .setPopup(popup)
                  .addTo(map.current);
                
                allMarkers.push(marker);
                
                // Show popup on hover, close all others
                el.addEventListener('mouseenter', () => {
                  // Close all other popups
                  allMarkers.forEach(m => {
                    if (m !== marker && m.getPopup().isOpen()) {
                      m.togglePopup();
                    }
                  });
                  // Open this popup if not already open
                  if (!popup.isOpen()) {
                    marker.togglePopup();
                  }
                });
                
                // Close popup when mouse leaves the marker area
                el.addEventListener('mouseleave', () => {
                  setTimeout(() => {
                    if (!el.matches(':hover') && popup.isOpen()) {
                      marker.togglePopup();
                    }
                  }, 300);
                });
              });
              
              // Always show POI markers
              fetchNearbyPOIs(userLocation, selectedRadius);
              
              console.log(`Raydius: Loaded map with ${weatherData.length} weather points`);
            });
            
            map.current.on('error', (e) => {
              console.error('Map error:', e);
            });
            
          } catch (error) {
            console.error('Map initialization error:', error);
          }
        };
        
        setTimeout(tryInitMap, 200);
        
      }, [userLocation, weatherData, selectedRadius, sunriseSunset]);

      // Fetch nearby POIs from OpenStreetMap
      const fetchNearbyPOIs = async (location, radiusKm) => {
        try {
          // Expand search radius by 50% to get more results
          const searchRadius = radiusKm * 1.5;
          const radiusDegrees = searchRadius / 111;
          const bbox = `${location.lat - radiusDegrees},${location.lon - radiusDegrees},${location.lat + radiusDegrees},${location.lon + radiusDegrees}`;
          
          // Query Overpass API - Prioritized outdoor spaces (cleaned up)
          const query = `
            [out:json][timeout:30];
            (
              node["amenity"="pub"]["outdoor_seating"="yes"](${bbox});
              node["amenity"="pub"]["garden"="yes"](${bbox});
              node["amenity"="pub"]["beer_garden"="yes"](${bbox});
              node["amenity"="bar"]["outdoor_seating"="yes"](${bbox});
              node["leisure"="beer_garden"](${bbox});
              way["leisure"="beer_garden"](${bbox});
              node["natural"="beach"](${bbox});
              way["natural"="beach"](${bbox});
              node["leisure"="park"](${bbox});
              way["leisure"="park"](${bbox});
              relation["leisure"="park"](${bbox});
              way["landuse"="forest"](${bbox});
              way["landuse"="grass"](${bbox});
              way["landuse"="meadow"](${bbox});
              way["landuse"="recreation_ground"](${bbox});
              way["landuse"="village_green"](${bbox});
              node["amenity"="restaurant"]["outdoor_seating"="yes"](${bbox});
              node["amenity"="cafe"]["outdoor_seating"="yes"](${bbox});
              node["amenity"="shelter"](${bbox});
              way["leisure"="common"](${bbox});
              way["boundary"="national_park"](${bbox});
              way["leisure"="nature_reserve"](${bbox});
              way["natural"="wetland"](${bbox});
              way["natural"="heath"](${bbox});
              way["natural"="grassland"](${bbox});
              way["landuse"="greenfield"](${bbox});
              node["tourism"="picnic_site"](${bbox});
              way["tourism"="viewpoint"](${bbox});
              node["tourism"="viewpoint"](${bbox});
            );
            out center 350;
          `;
          
          const response = await fetch('https://overpass-api.de/api/interpreter', {
            method: 'POST',
            body: query
          });
          
          const data = await response.json();
          
          console.log(`Fetched ${data.elements.length} POI elements from OpenStreetMap`);
          
          // Add POI markers - focused on leisure spaces + outdoor dining/drinking
          data.elements.slice(0, 350).forEach((poi) => {
            const lat = poi.lat || poi.center?.lat;
            const lon = poi.lon || poi.center?.lon;
            
            if (!lat || !lon) return;
            
            let icon = '⛲';
            let label = 'Park';
            let color = '#10B981';
            
            // Priority 1: Pubs & Bars
            if (poi.tags?.amenity === 'pub' || poi.tags?.leisure === 'beer_garden') {
              icon = '🍺';
              label = 'Pub/Beer Garden';
              color = '#F59E0B';
            } else if (poi.tags?.amenity === 'bar' && poi.tags?.outdoor_seating === 'yes') {
              icon = '🍻';
              label = 'Bar';
              color = '#F59E0B';
            }
            // Priority 2: Beaches, Parks, Forests, Green areas
            else if (poi.tags?.natural === 'beach') {
              icon = '🏖️';
              label = 'Beach';
              color = '#F59E0B';
            } else if (poi.tags?.leisure === 'park') {
              icon = '⛲';
              label = 'Park';
              color = '#10B981';
            } else if (poi.tags?.landuse === 'forest') {
              icon = '🌲';
              label = 'Forest';
              color = '#059669';
            } else if (poi.tags?.landuse === 'grass' || poi.tags?.landuse === 'meadow' || poi.tags?.landuse === 'greenfield' || poi.tags?.leisure === 'recreation_ground' || poi.tags?.landuse === 'recreation_ground') {
              icon = '🌿';
              label = 'Green Space';
              color = '#F59E0B';
            }
            // Priority 3: Restaurants & Cafes
            else if (poi.tags?.amenity === 'restaurant' && poi.tags?.outdoor_seating === 'yes') {
              icon = '🍽️';
              label = 'Restaurant';
              color = '#F59E0B';
            } else if (poi.tags?.amenity === 'cafe' && poi.tags?.outdoor_seating === 'yes') {
              icon = '☕';
              label = 'Cafe';
              color = '#F59E0B';
            }
            // Priority 4: Everything else
            else if (poi.tags?.amenity === 'shelter') {
              icon = '⛺';
              label = 'Shelter';
              color = '#6B7280';
            } else if (poi.tags?.boundary === 'national_park' || poi.tags?.leisure === 'nature_reserve') {
              icon = '🏞️';
              label = 'Nature Reserve';
              color = '#10B981';
            } else if (poi.tags?.natural === 'wetland') {
              icon = '🦆';
              label = 'Wetland';
              color = '#3B82F6';
            } else if (poi.tags?.natural === 'heath' || poi.tags?.natural === 'grassland') {
              icon = '🌾';
              label = 'Heath';
              color = '#F59E0B';
            } else if (poi.tags?.tourism === 'picnic_site') {
              icon = '🧺';
              label = 'Picnic Area';
              color = '#10B981';
            } else if (poi.tags?.tourism === 'viewpoint') {
              icon = '👁️';
              label = 'Viewpoint';
              color = '#3B82F6';
            }
            
            const el = document.createElement('div');
            el.innerHTML = icon;
            el.style.fontSize = '24px';
            el.style.cursor = 'pointer';
            
            new mapboxgl.Marker(el)
              .setLngLat([lon, lat])
              .setPopup(

                  .setHTML(`
                    <div style="text-align: center; padding: 10px;">
                      <div style="font-size: 32px; margin-bottom: 6px;">${icon}</div>
                      <div style="font-weight: bold; font-size: 14px; color: #374151;">${label}</div>

                        onmouseout="this.style.opacity='1'">

          savedAt: new Date().toLocaleString(),
          name: `${location.clouds < 50 ? 'Clear' : 'Cloudy'} spot`
        };

        if (cloudCover < 80) return 'bg-gray-400';

                      <div>🍺 Pubs (outdoor seating)</div>
                      <div>🍻 Bars (outdoor seating)</div>
                      <div>🍽️ Restaurants (outdoor)</div>
                      <div>☕ Cafes (outdoor seating)</div>
                      <div>⛺ Shelters</div>
                      <div>🦆 Wetlands</div>
                      <div>🏞️ Nature reserves</div>
                      <div>🌾 Heath areas</div>
                      <div>🧺 Picnic areas</div>
                      <div>👁️ Viewpoints</div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* Best Spot Cards */}
            {sunniestSpot && shadiestSpot && !loading && (
              <div className="mb-6">
                <h2 className="text-2xl font-bold text-white text-center mb-4">Best spot for...</h2>
                <div className="grid md:grid-cols-2 gap-4">
                  {/* Clear Skies */}
                  <div className="rounded-2xl shadow-xl p-6 text-white bg-gradient-to-r from-yellow-400 to-orange-400">
                    <h3 className="text-xl font-bold mb-3">...clear skies</h3>
                    <div className="mb-4">
                      <p className="text-4xl mb-2">{getCloudEmoji(sunniestSpot.clouds)}</p>
                      <p className="text-2xl font-semibold">{Math.round(sunniestSpot.clouds)}% clouds</p>
                      <p className="text-white/90">{Math.round(sunniestSpot.temp)}°C</p>
                    </div>
                    <div className="flex gap-2">
                      <button onClick={() => openDirections(sunniestSpot.lat, sunniestSpot.lon)}
                        className="flex-1 px-4 py-2 bg-white/20 hover:bg-white/30 rounded-lg text-sm font-semibold">
                        📍 Go
                      </button>
                      <button onClick={() => addToFavorites(sunniestSpot)}
                        className="px-4 py-2 bg-white/20 hover:bg-white/30 rounded-lg text-sm font-semibold">
                        ⭐
                      </button>
                      <button onClick={() => shareSpot(sunniestSpot)}
                        className="px-4 py-2 bg-white/20 hover:bg-white/30 rounded-lg text-sm font-semibold">
                        📤
                      </button>
                    </div>
                  </div>
                  {/* Cloud Cover */}
                  <div className="rounded-2xl shadow-xl p-6 text-white bg-gradient-to-r from-slate-500 to-slate-700">
                    <h3 className="text-xl font-bold mb-3">...cloud cover</h3>
                    <div className="mb-4">
                      <p className="text-4xl mb-2">{getCloudEmoji(shadiestSpot.clouds)}</p>
                      <p className="text-2xl font-semibold">{Math.round(shadiestSpot.clouds)}% clouds</p>
                      <p className="text-white/90">{Math.round(shadiestSpot.temp)}°C</p>
                    </div>
                    <div className="flex gap-2">
                      <button onClick={() => openDirections(shadiestSpot.lat, shadiestSpot.lon)}
                        className="flex-1 px-4 py-2 bg-white/20 hover:bg-white/30 rounded-lg text-sm font-semibold">
                        📍 Go
                      </button>
                      <button onClick={() => addToFavorites(shadiestSpot)}
                        className="px-4 py-2 bg-white/20 hover:bg-white/30 rounded-lg text-sm font-semibold">
                        ⭐
                      </button>
                      <button onClick={() => shareSpot(shadiestSpot)}
                        className="px-4 py-2 bg-white/20 hover:bg-white/30 rounded-lg text-sm font-semibold">
                        📤
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* Data Cards - each renders independently */}
            {!loading && (uvIndex !== null || sunriseSunset || auroraData) && (
              <div className="grid md:grid-cols-3 gap-4 mb-6">
                {/* UV Index */}
                {uvIndex !== null && (
                  <div className={`${getUVColor(uvIndex).bg} rounded-xl shadow-lg p-6`}>
                    <h3 className="font-bold text-gray-800 mb-3">☀️ UV Index</h3>
                    <div className={`text-4xl font-bold mb-2 ${getUVColor(uvIndex).text}`}>{uvIndex.toFixed(1)}</div>
                    <p className={`font-semibold ${getUVColor(uvIndex).text}`}>{getUVColor(uvIndex).label}</p>
                    {uvIndex >= 6 && (
                      <div className="mt-3">
                        <p className="text-sm font-semibold text-red-700">🧴 Sunscreen recommended!</p>
                        <button
                          onClick={requestNotificationPermission}
                          className="mt-2 text-xs px-3 py-1 bg-blue-500 text-white rounded hover:bg-blue-600">
                          Enable UV alerts
                        </button>
                      </div>
                    )}
                  </div>
                )}

                {/* Sunrise/Sunset */}
                {sunriseSunset && (
                  <div className="bg-gradient-to-br from-orange-100 to-pink-100 rounded-xl shadow-lg p-6">
                    <h3 className="font-bold text-gray-800 mb-3">🌅 Sun Times</h3>
                    <div className="space-y-2 text-sm">
                      <div className="flex justify-between">
                        <span className="text-gray-600">Sunrise:</span>
                        <span className="font-semibold text-orange-700">{sunriseSunset.sunrise}</span>
                      </div>
                      <div className="flex justify-between">
                        <span className="text-gray-600">Sunset:</span>
                        <span className="font-semibold text-pink-700">{sunriseSunset.sunset}</span>
                      </div>
                      {isNightTime() && (
                        <div className="mt-2 p-2 bg-slate-700 text-white rounded text-xs text-center">
                          🌙 Currently nighttime
                        </div>
                      )}
                    </div>
                  </div>
                )}

                {/* Aurora */}
                {auroraData && (
                  <div className={`rounded-xl shadow-lg p-6 ${
                    auroraData.visible ? 'bg-gradient-to-br from-purple-200 to-green-200' : 'bg-gradient-to-br from-slate-100 to-slate-200'
                  }`}>
                    <h3 className="font-bold text-gray-800 mb-3">
                      {auroraData.visible ? '🌌' : '🌃'} Aurora
                    </h3>
                    <div className="text-3xl font-bold mb-2 text-purple-700">Kp {auroraData.kpIndex.toFixed(1)}</div>
                    <p className={`font-semibold text-sm ${auroraData.visible ? 'text-green-700' : 'text-gray-600'}`}>
                      {auroraData.probability} Activity
                    </p>
                    {auroraData.visible && (
                      <p className="text-green-700 font-semibold text-sm mt-2">✨ Visible tonight!</p>
                    )}
                    <p className="text-xs text-gray-500 mt-2">Regional — not location-specific</p>
                  </div>
                )}
              </div>
            )}

            {/* Footer */}
            <div className="mt-6 text-center text-white/80 text-sm">
              <p>✨ Live data from OpenWeatherMap, NOAA & OpenStreetMap</p>
              <p className="text-xs mt-1">
                {userLocation ? `📍 ${searchQuery || `${userLocation.lat.toFixed(2)}°N, ${userLocation.lon.toFixed(2)}°E`}` : 'Loading location...'}
                {weatherData.length > 0 && ` · ${weatherData.length} locations tracked`}
              </p>
              <p className="text-xs mt-1 text-white/60">
                🌍 Search any city worldwide to explore conditions
              </p>
            </div>
          </div>
        </div>
      );
    }

    // Render the app
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
    
    // Initialize Lucide icons after React renders
    setTimeout(() => {
      if (window.lucide) {
        window.lucide.createIcons();
      }
    }, 100);
    
    // Register service worker for PWA functionality
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then((registration) => {
            console.log('✅ Raydius: Service Worker registered');
          })
          .catch((error) => {
            console.log('❌ Raydius: Service Worker registration failed:', error);
          });
      });
    }
  </script>
</body>
</html>
